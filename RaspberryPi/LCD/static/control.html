<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeNest LCD 원격 제어</title>
  <link rel="stylesheet" href="./common.css?v=20260825-1" />
  <style>
    body { padding: 24px; }
    .control-app { width: min(1120px, 100%); margin: 0 auto; }
    .control-header {
      margin-bottom: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }
    .control-header h1 { margin: 0 0 5px; font-size: clamp(27px, 4vw, 42px); letter-spacing: -.05em; }
    .control-header p { margin: 0; color: var(--muted); }
    .connection-status {
      flex: 0 0 auto;
      padding: 7px 11px;
      color: #12623a;
      background: #eaf7ef;
      border: 1px solid #b9dec8;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 850;
    }
    .connection-status.offline { color: #a33a32; background: #fff0ef; border-color: #efc4c0; }
    .control-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; }
    .preview-shell {
      min-height: 500px;
      padding: 10px;
      overflow: hidden;
      background: #242a31;
      border: 8px solid #3b424a;
      border-radius: 24px;
      box-shadow: 0 16px 38px rgba(19, 31, 45, .14);
    }
    .panel {
      padding: 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 13px 30px rgba(19, 31, 45, .08);
    }
    .panel h2 { margin: 0 0 5px; font-size: 21px; }
    .panel-note { margin: 0 0 15px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .room-editor { margin-bottom: 15px; padding: 13px; background: #f8fafc; border: 1px solid var(--line); border-radius: 13px; }
    .room-editor label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .room-row { display: flex; gap: 7px; }
    .room-row input { min-width: 0; flex: 1; padding: 10px; border: 1px solid #cfd6df; border-radius: 9px; outline: none; }
    .room-row input:focus { border-color: var(--occupied); box-shadow: 0 0 0 3px rgba(23, 105, 170, .11); }
    .buttons { display: grid; gap: 8px; }
    button, .display-link {
      padding: 11px 12px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #cfd6df;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 800;
      text-align: left;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease;
    }
    button:hover, .display-link:hover { transform: translateY(-1px); border-color: #8d99a8; }
    button:focus-visible, .display-link:focus-visible { outline: 3px solid rgba(23, 105, 170, .25); outline-offset: 2px; }
    button.selected { color: #fff; background: var(--occupied); border-color: var(--occupied); }
    .save-room { flex: 0 0 auto; text-align: center; }
    .secondary-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 13px; }
    .auto-button, .display-link, .guide-link { text-align: center; background: #edf4fa; border-color: #b8d0e4; }
    .hint { margin-top: 13px; padding-top: 12px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; line-height: 1.55; }
    @media (max-width: 900px) {
      body { padding: 14px; }
      .control-grid { grid-template-columns: 1fr; }
      .preview-shell { min-height: min(540px, 70vh); }
      .buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .control-header { align-items: flex-start; flex-direction: column; }
      .preview-shell { min-height: 480px; }
      .buttons, .secondary-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="control-app">
    <header class="control-header">
      <div>
        <h1>SafeNest LCD 제어</h1>
        <p>노트북에서 선택한 상태가 Raspberry Pi LCD에 바로 표시됩니다.</p>
      </div>
      <span class="connection-status offline" id="connectionStatus">서버 확인 중</span>
    </header>

    <div class="control-grid">
      <section class="preview-shell" aria-label="현재 LCD 화면 미리보기">
        <div class="lcd" id="preview" data-state="normal-empty">
          <header class="topbar">
            <div class="brand"><span class="brand-mark"></span>SafeNest</div>
            <div class="topbar-meta">
              <span class="sensor-status" id="previewSensorStatus" data-status="waiting">센서 연결 대기</span>
              <strong class="room-name" id="previewRoom">밀폐공간 A-01</strong>
            </div>
          </header>
          <section class="emergency-banner" id="previewEmergencyBanner" data-phase="active" hidden>
            <div class="emergency-banner-copy">
              <strong id="previewEmergencyTitle">🚨 긴급 상황 — 작업자 상태를 즉시 확인하세요</strong>
              <span id="previewEmergencyTime">발생 --:--:--</span>
            </div>
            <button class="emergency-confirm" id="previewEmergencyConfirm" type="button" disabled>확인</button>
          </section>
          <div class="main-state"><div>
            <div class="status-pill" id="previewPill">정상 · 미재실</div>
            <h2 class="state-title" id="previewTitle">정상</h2>
            <p class="state-subtitle" id="previewSubtitle">감지된 사람이 없습니다</p>
          </div></div>
          <div class="metrics" id="previewMetrics"></div>
          <div class="comment" id="previewComment">정상 모니터링 중입니다</div>
        </div>
      </section>

      <aside class="panel">
        <h2>수동 화면 전환</h2>
        <p class="panel-note">버튼 또는 키보드 숫자 1~6을 누르세요.</p>
        <div class="room-editor">
          <label for="roomInput">방·공간 이름</label>
          <div class="room-row">
            <input id="roomInput" type="text" maxlength="24" value="밀폐공간 A-01" />
            <button class="save-room" id="saveRoom" type="button">적용</button>
          </div>
        </div>
        <div class="buttons" id="buttons">
          <button data-state="normal-empty" type="button">1. 정상 · 사람 없음</button>
          <button data-state="normal-occupied" type="button">2. 정상 · 사람 있음</button>
          <button data-state="warning" type="button">3. 주의 · CO₂ 높음</button>
          <button data-state="danger" type="button">4. 위험 · 호흡 이상</button>
          <button data-state="emergency" type="button">5. 긴급 · 복합 위험</button>
          <button data-state="offline" type="button">6. 통신·센서 오류</button>
        </div>
        <div class="secondary-actions">
          <button class="auto-button" id="autoButton" type="button">자동 순환 시작</button>
          <a class="display-link" href="/display" target="_blank" rel="noopener">LCD 화면</a>
          <a class="display-link guide-link" href="/guide.html" target="_blank" rel="noopener">실행 가이드</a>
        </div>
        <div class="hint">수동 선택 시 자동 순환은 즉시 중지됩니다. 마지막 상태와 공간 이름은 Raspberry Pi에 저장됩니다.</div>
      </aside>
    </div>
  </main>

  <script>
    const scenarios = {
      "normal-empty": {
        pill: "정상 · 미재실", title: "정상", subtitle: "감지된 사람이 없습니다",
        metricPlan: [
          { label: "심박수", value: "없음" },
          { label: "호흡수", value: "없음" },
          { label: "CO₂", range: [560, 680], unit: "ppm" },
          { label: "움직임", value: "감지 안 됨" }
        ],
        comment: "정상 모니터링 중입니다"
      },
      "normal-occupied": {
        pill: "정상 · 재실", title: "안전", subtitle: "작업자의 움직임이 감지됩니다",
        metricPlan: [
          { label: "심박수", range: [68, 82], unit: "bpm" },
          { label: "호흡수", range: [14, 20], unit: "회/분" },
          { label: "CO₂", range: [720, 880], unit: "ppm" },
          { label: "움직임", value: "감지됨" }
        ],
        comment: "안전 상태를 계속 확인합니다"
      },
      warning: {
        pill: "환경 주의", title: "주의", subtitle: "CO₂ 농도가 높습니다",
        metricPlan: [
          { label: "심박수", range: [70, 95], unit: "bpm" },
          { label: "호흡수", range: [16, 24], unit: "회/분" },
          { label: "CO₂", range: [1200, 1600], unit: "ppm" },
          { label: "움직임", value: "감지됨" }
        ],
        comment: "환기 후 작업자 상태를 확인하세요"
      },
      danger: {
        pill: "작업자 위험", title: "위험", subtitle: "무움직임과 호흡 이상 감지",
        metricPlan: [
          { label: "심박수", range: [88, 118], unit: "bpm" },
          { label: "호흡수", range: [4, 10], unit: "회/분" },
          { label: "CO₂", range: [900, 1100], unit: "ppm" },
          { label: "움직임", value: "감지 안 됨" }
        ],
        comment: "작업자의 상태를 즉시 확인하세요"
      },
      emergency: {
        pill: "긴급 경보 작동 중", title: "긴급", subtitle: "고체온·호흡 이상·무움직임",
        metricPlan: [
          { label: "심박수", range: [110, 150], unit: "bpm" },
          { label: "호흡수", range: [2, 8], unit: "회/분" },
          { label: "CO₂", range: [1100, 1400], unit: "ppm" },
          { label: "움직임", value: "감지 안 됨" }
        ],
        comment: "즉시 현장을 확인하고 구조를 요청하세요"
      },
      offline: {
        pill: "시스템 점검 필요", title: "통신 오류", subtitle: "센서 데이터를 받을 수 없습니다",
        metricPlan: [
          { label: "심박수", value: "수신 불가" },
          { label: "호흡수", value: "수신 불가" },
          { label: "CO₂", value: "수신 불가" },
          { label: "움직임", value: "감지 불가" }
        ],
        comment: "장비 전원과 센서 통신 연결을 확인하세요"
      }
    };
    const order = ["normal-empty", "normal-occupied", "warning", "danger", "emergency", "offline"];
    const preview = document.getElementById("preview");
    const previewRoom = document.getElementById("previewRoom");
    const previewSensorStatus = document.getElementById("previewSensorStatus");
    const previewEmergencyBanner = document.getElementById("previewEmergencyBanner");
    const previewEmergencyTitle = document.getElementById("previewEmergencyTitle");
    const previewEmergencyTime = document.getElementById("previewEmergencyTime");
    const previewEmergencyConfirm = document.getElementById("previewEmergencyConfirm");
    const previewPill = document.getElementById("previewPill");
    const previewTitle = document.getElementById("previewTitle");
    const previewSubtitle = document.getElementById("previewSubtitle");
    const previewMetrics = document.getElementById("previewMetrics");
    const previewComment = document.getElementById("previewComment");
    const roomInput = document.getElementById("roomInput");
    const connectionStatus = document.getElementById("connectionStatus");
    const buttons = [...document.querySelectorAll("#buttons button[data-state]")];
    const autoButton = document.getElementById("autoButton");
    let currentState = "normal-empty";
    let autoTimer = null;
    let presentationMetricState = "";
    let presentationMetricUpdatedAt = 0;
    let presentationMetricCache = [];

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function presentationMetrics(stateName, scenario) {
      const now = Date.now();
      const shouldRefresh = stateName !== presentationMetricState
        || now - presentationMetricUpdatedAt >= 1800;
      if (shouldRefresh) {
        presentationMetricState = stateName;
        presentationMetricUpdatedAt = now;
        presentationMetricCache = scenario.metricPlan.map((metric) => {
          if (metric.range) {
            return [
              metric.label,
              `${randomInt(metric.range[0], metric.range[1]).toLocaleString("ko-KR")} ${metric.unit}`
            ];
          }
          return [metric.label, metric.value];
        });
      }
      return presentationMetricCache;
    }

    function renderSensorStatus(sensor) {
      const status = sensor?.status || "waiting";
      const labels = {
        live: "센서 실시간",
        stale: "센서 연결 끊김",
        error: "센서 수신기 오류",
        waiting: "센서 연결 대기"
      };
      previewSensorStatus.dataset.status = status;
      previewSensorStatus.textContent = labels[status] || labels.waiting;
    }

    function render(payload) {
      const scenario = scenarios[payload.state] || scenarios.offline;
      currentState = payload.state in scenarios ? payload.state : "offline";
      preview.dataset.state = currentState;
      previewRoom.textContent = payload.room || "밀폐공간 A-01";
      roomInput.value = payload.room || "밀폐공간 A-01";
      previewPill.textContent = scenario.pill;
      previewTitle.textContent = scenario.title;
      previewSubtitle.textContent = scenario.subtitle;
      previewComment.textContent = scenario.comment;
      const emergency = payload.emergency || {};
      const activeEmergency = currentState === "emergency" || emergency.active === true;
      const recoveredEmergency = !activeEmergency && emergency.recovery_pending === true;
      previewEmergencyBanner.hidden = !(activeEmergency || recoveredEmergency);
      preview.classList.toggle("has-alert-banner", activeEmergency || recoveredEmergency);
      if (recoveredEmergency) {
        previewEmergencyBanner.dataset.phase = "recovered";
        previewEmergencyTitle.textContent = "✓ 센서 정상 복귀 — 정상 모니터링으로 전환되었습니다";
        previewEmergencyTime.textContent = "복귀 완료";
        previewEmergencyConfirm.textContent = "종료 확인";
      } else if (emergency.acknowledged === true) {
        previewEmergencyBanner.dataset.phase = "acknowledged";
        previewEmergencyTitle.textContent = "✓ 관리자 확인 완료 — 현장 대응을 계속하세요";
        previewEmergencyTime.textContent = "관리자 확인됨";
        previewEmergencyConfirm.textContent = "확인됨";
      } else {
        previewEmergencyBanner.dataset.phase = "active";
        previewEmergencyTitle.textContent = "🚨 긴급 상황 — 작업자 상태를 즉시 확인하세요";
        previewEmergencyTime.textContent = "발생 시각 표시";
        previewEmergencyConfirm.textContent = "확인";
      }
      renderSensorStatus(payload.sensors);
      if (currentState === "offline") {
        previewSensorStatus.dataset.status = "error";
        previewSensorStatus.textContent = "통신 오류";
      }
      previewMetrics.replaceChildren(...presentationMetrics(currentState, scenario).map(([label, value]) => {
        const item = document.createElement("div");
        item.className = "metric";
        const labelElement = document.createElement("span");
        labelElement.className = "metric-label";
        labelElement.textContent = label;
        const valueElement = document.createElement("strong");
        valueElement.className = "metric-value";
        valueElement.textContent = value;
        item.append(labelElement, valueElement);
        return item;
      }));
      buttons.forEach(button => {
        const selected = button.dataset.state === currentState;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    function setConnected(connected) {
      connectionStatus.textContent = connected ? "LCD 서버 연결됨" : "LCD 서버 연결 끊김";
      connectionStatus.classList.toggle("offline", !connected);
    }

    async function getState() {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) throw new Error("request failed");
        render(await response.json());
        setConnected(true);
      } catch (error) {
        setConnected(false);
      }
    }

    async function updateState(change) {
      try {
        const response = await fetch("/api/state", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(change)
        });
        if (!response.ok) throw new Error("update failed");
        render(await response.json());
        setConnected(true);
      } catch (error) {
        setConnected(false);
      }
    }

    function stopAuto() {
      clearInterval(autoTimer);
      autoTimer = null;
      autoButton.textContent = "자동 순환 시작";
    }

    buttons.forEach(button => button.addEventListener("click", () => {
      stopAuto();
      updateState({ state: button.dataset.state });
    }));
    document.getElementById("saveRoom").addEventListener("click", () => updateState({ room: roomInput.value }));
    roomInput.addEventListener("keydown", event => {
      if (event.key === "Enter") updateState({ room: roomInput.value });
    });
    autoButton.addEventListener("click", () => {
      if (autoTimer) return stopAuto();
      autoButton.textContent = "자동 순환 중지";
      autoTimer = setInterval(() => {
        const next = (order.indexOf(currentState) + 1) % order.length;
        updateState({ state: order[next] });
      }, 3000);
    });
    document.addEventListener("keydown", event => {
      if (event.target === roomInput) return;
      const index = Number(event.key) - 1;
      if (index >= 0 && index < order.length) {
        stopAuto();
        updateState({ state: order[index] });
      }
    });

    getState();
    setInterval(getState, 1500);
  </script>
</body>
</html>
