<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeNest LCD</title>
  <link rel="stylesheet" href="/common.css" />
  <style>
    html, body { height: 100%; overflow: hidden; background: #111820; cursor: none; }
    .display-frame { width: 100vw; height: 100vh; background: #fff; }
    .connection {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 40;
      padding: 4px 8px;
      color: #fff;
      background: rgba(23, 32, 42, .74);
      border-radius: 999px;
      font-size: 11px;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .connection.visible { opacity: 1; }
    .lcd { padding: clamp(10px, 2.2vh, 18px) clamp(12px, 2vw, 22px); }
    .topbar { min-height: clamp(40px, 7vh, 54px); }
    .brand { font-size: clamp(20px, 3.6vh, 30px); }
    .room-name { font-size: clamp(14px, 2.6vh, 21px); }
    .availability {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 6px;
    }
    .availability-item { padding: 3px 6px; font-size: clamp(9px, 1.5vh, 11px); }
    .thermal-ai-layout {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.22fr) minmax(250px, .78fr);
      gap: clamp(8px, 1.4vw, 14px);
      margin: clamp(7px, 1.3vh, 11px) 0;
    }
    .thermal-panel, .ai-panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #d7dee7;
      border-radius: clamp(10px, 1.7vw, 16px);
      background: #f8fafc;
    }
    .panel-heading {
      height: 34px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #344054;
      font-size: clamp(11px, 1.9vh, 14px);
      font-weight: 850;
    }
    .panel-heading strong { color: #17202a; }
    .live-dot {
      width: 8px;
      height: 8px;
      display: inline-block;
      margin-right: 5px;
      border-radius: 50%;
      background: #98a2b3;
    }
    .thermal-panel[data-status="live"] .live-dot {
      background: #22a06b;
      box-shadow: 0 0 0 4px rgba(34, 160, 107, .14);
    }
    .thermal-visual {
      position: relative;
      height: calc(100% - 66px);
      min-height: 130px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 46%, #263342, #080d13 72%);
    }
    .thermal-visual img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
    }
    .thermal-panel[data-status="stale"] .thermal-visual img { opacity: .42; }
    .thermal-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      color: #d0d5dd;
      background: rgba(8, 13, 19, .66);
      text-align: center;
      font-size: clamp(13px, 2.2vh, 17px);
      font-weight: 800;
    }
    .thermal-panel[data-status="live"] .thermal-placeholder { display: none; }
    .thermal-caption {
      height: 32px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #667085;
      font-size: clamp(10px, 1.7vh, 12px);
      font-weight: 750;
    }
    .ai-panel {
      --ai-accent: #667085;
      padding: 9px 12px 10px;
      display: flex;
      flex-direction: column;
      border-top: 5px solid var(--ai-accent);
      background: #fff;
    }
    .ai-panel[data-class="NOT_HUMAN"] { --ai-accent: #667085; }
    .ai-panel[data-class="HUMAN_NORMAL"] { --ai-accent: #14804a; }
    .ai-panel[data-class="HUMAN_FALL"] { --ai-accent: #c62828; }
    .ai-panel[data-class="INPUT_UNAVAILABLE"] { --ai-accent: #b76e00; }
    .ai-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #667085;
      font-size: clamp(10px, 1.7vh, 12px);
      font-weight: 850;
      letter-spacing: .04em;
    }
    .status-pill {
      margin: 0;
      padding: 3px 8px;
      font-size: clamp(9px, 1.5vh, 11px);
    }
    .ai-result {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      align-content: center;
      padding: 4px 0;
    }
    .ai-result-label {
      margin: 0;
      color: var(--ai-accent);
      font-size: clamp(23px, 5.2vh, 42px);
      line-height: 1.03;
      letter-spacing: -.055em;
    }
    .ai-class {
      margin-top: 5px;
      color: #667085;
      font: 750 clamp(9px, 1.6vh, 11px)/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .ai-confidence {
      margin-top: 7px;
      color: #344054;
      font-size: clamp(12px, 2.2vh, 16px);
      font-weight: 850;
    }
    .probabilities { display: grid; gap: 4px; margin-top: 7px; }
    .probability { display: grid; grid-template-columns: 42px 1fr 34px; align-items: center; gap: 6px; }
    .probability span, .probability strong { font-size: clamp(9px, 1.5vh, 11px); }
    .probability span { color: #667085; }
    .probability strong { text-align: right; }
    .probability-track { height: 6px; overflow: hidden; border-radius: 999px; background: #e4e7ec; }
    .probability-track i { width: 0; height: 100%; display: block; border-radius: inherit; background: var(--ai-accent); transition: width .2s ease; }
    .ai-foot {
      padding-top: 6px;
      border-top: 1px solid #eaecf0;
      color: #667085;
      font-size: clamp(9px, 1.5vh, 11px);
      line-height: 1.35;
    }
    .risk-line { color: #344054; font-weight: 800; }
    .metrics { gap: 6px; }
    .metric { padding: 6px 8px; border-top-width: 3px; border-radius: 9px; }
    .metric-label { font-size: clamp(9px, 1.5vh, 11px); }
    .metric-value { font-size: clamp(13px, 2.6vh, 20px); }
    .comment, .main-state { display: none; }
    @media (max-height: 430px) {
      .availability { display: none; }
      .thermal-ai-layout { margin: 6px 0; }
      .thermal-visual { height: calc(100% - 58px); }
      .thermal-caption { height: 24px; }
      .panel-heading { height: 34px; }
    }
    @media (max-width: 620px) and (min-height: 600px) {
      html, body { overflow: auto; }
      .display-frame { min-height: 100vh; height: auto; }
      .lcd { min-height: 100vh; overflow: visible; }
      .thermal-ai-layout { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 1fr) auto; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="display-frame">
    <section class="lcd" id="lcd" data-state="normal-empty" aria-live="polite">
      <header class="topbar">
        <div class="brand"><span class="brand-mark"></span>SafeNest</div>
        <div class="topbar-meta">
          <span class="sensor-status" id="sensorStatus" data-status="waiting">센서 연결 대기</span>
          <strong class="room-name" id="roomName">밀폐공간 A-01</strong>
        </div>
      </header>
      <div class="availability" id="availability" aria-label="runtime availability"></div>
      <div class="thermal-ai-layout">
        <section class="thermal-panel" id="thermalPanel" data-status="waiting" aria-label="OpenCV 열화상 영상">
          <div class="panel-heading">
            <strong><span class="live-dot"></span>OpenCV 열화상</strong>
            <span id="thermalFrame">프레임 대기</span>
          </div>
          <div class="thermal-visual">
            <img id="thermalImage" alt="OpenCV로 변환한 실시간 열화상 프레임" />
            <div class="thermal-placeholder" id="thermalPlaceholder">열화상 프레임 수신 대기</div>
          </div>
          <div class="thermal-caption">
            <span id="thermalRange">RAW 범위 —</span>
            <span>80×62 · INFERNO</span>
          </div>
        </section>

        <section class="ai-panel" id="thermalAiPanel" data-class="INPUT_UNAVAILABLE" aria-label="온디바이스 AI 추론 결과">
          <div class="ai-heading">
            <span>ON-DEVICE AI</span>
            <span class="status-pill" id="statusPill">정상 · 미재실</span>
          </div>
          <div class="ai-result">
            <h1 class="ai-result-label" id="thermalAiLabel">판정 대기</h1>
            <div class="ai-class" id="thermalAiClass">INPUT_UNAVAILABLE</div>
            <div class="ai-confidence" id="thermalAiConfidence">신뢰도 —</div>
            <div class="probabilities" aria-label="열화상 분류 확률">
              <div class="probability"><span>미감지</span><div class="probability-track"><i id="probNotHuman"></i></div><strong id="probNotHumanValue">—</strong></div>
              <div class="probability"><span>정상</span><div class="probability-track"><i id="probNormal"></i></div><strong id="probNormalValue">—</strong></div>
              <div class="probability"><span>쓰러짐</span><div class="probability-track"><i id="probFall"></i></div><strong id="probFallValue">—</strong></div>
            </div>
          </div>
          <div class="ai-foot">
            <div class="risk-line"><span id="stateTitle">정상</span> · <span id="stateSubtitle">감지된 사람이 없습니다</span></div>
            <div id="thermalAiMeta">모델 준비 상태 확인 중</div>
            <div id="comment">정상 모니터링 중입니다</div>
          </div>
        </section>
      </div>
      <div class="metrics" id="metrics"></div>
    </section>
  </main>
  <div class="connection" id="connection">제어 서버 연결 중…</div>

  <script>
    const scenarios = {
      "normal-empty": {
        pill: "정상 · 미재실", title: "정상", subtitle: "감지된 사람이 없습니다",
        metrics: [["CO₂ 수치", "620 ppm"], ["공간 온도", "24.3℃"], ["움직임 감지", "감지 안 됨"]],
        comment: "정상 모니터링 중입니다"
      },
      "normal-occupied": {
        pill: "정상 · 재실", title: "안전", subtitle: "작업자의 움직임이 감지됩니다",
        metrics: [["CO₂ 수치", "820 ppm"], ["인체 표면온도", "36.7℃"], ["움직임 감지", "감지됨"]],
        comment: "안전 상태를 계속 확인합니다"
      },
      warning: {
        pill: "환경 주의", title: "주의", subtitle: "CO₂ 농도가 높습니다",
        metrics: [["CO₂ 수치", "1,500 ppm"], ["공간 온도", "26.1℃"], ["움직임 감지", "감지됨"]],
        comment: "환기 후 작업자 상태를 확인하세요"
      },
      danger: {
        pill: "작업자 위험", title: "위험", subtitle: "무움직임과 호흡 이상 감지",
        metrics: [["CO₂ 수치", "980 ppm"], ["인체 표면온도", "37.2℃"], ["움직임 감지", "감지 안 됨"]],
        comment: "작업자의 상태를 즉시 확인하세요"
      },
      emergency: {
        pill: "긴급 경보 작동 중", title: "긴급", subtitle: "고체온·호흡 이상·무움직임",
        metrics: [["CO₂ 수치", "1,240 ppm"], ["인체 표면온도", "39.1℃"], ["움직임 감지", "감지 안 됨"]],
        comment: "즉시 현장을 확인하고 구조를 요청하세요"
      },
      offline: {
        pill: "시스템 점검 필요", title: "통신 오류", subtitle: "센서 데이터를 받을 수 없습니다",
        metrics: [["CO₂ 수치", "수신 안 됨"], ["온도", "수신 안 됨"], ["움직임 감지", "확인 불가"]],
        comment: "장비 전원과 센서 통신 연결을 확인하세요"
      }
    };

    const lcd = document.getElementById("lcd");
    const roomName = document.getElementById("roomName");
    const sensorStatus = document.getElementById("sensorStatus");
    const availability = document.getElementById("availability");
    const statusPill = document.getElementById("statusPill");
    const stateTitle = document.getElementById("stateTitle");
    const stateSubtitle = document.getElementById("stateSubtitle");
    const metrics = document.getElementById("metrics");
    const comment = document.getElementById("comment");
    const connection = document.getElementById("connection");
    const thermalPanel = document.getElementById("thermalPanel");
    const thermalImage = document.getElementById("thermalImage");
    const thermalPlaceholder = document.getElementById("thermalPlaceholder");
    const thermalFrame = document.getElementById("thermalFrame");
    const thermalRange = document.getElementById("thermalRange");
    const thermalAiPanel = document.getElementById("thermalAiPanel");
    const thermalAiLabel = document.getElementById("thermalAiLabel");
    const thermalAiClass = document.getElementById("thermalAiClass");
    const thermalAiConfidence = document.getElementById("thermalAiConfidence");
    const thermalAiMeta = document.getElementById("thermalAiMeta");
    let failed = false;
    let lastThermalSequence = null;
    let thermalRequestInFlight = false;

    const THERMAL_CLASS_LABELS = {
      NOT_HUMAN: "사람 없음",
      HUMAN_NORMAL: "사람 감지 · 정상 자세",
      HUMAN_FALL: "쓰러짐 의심",
      INPUT_UNAVAILABLE: "판정 대기"
    };
    const THERMAL_PROBABILITIES = [
      ["probNotHuman", "probNotHumanValue"],
      ["probNormal", "probNormalValue"],
      ["probFall", "probFallValue"]
    ];

    const LCD_SENSOR_SHORT = {
      AVAILABLE: "OK",
      STALE: "STALE",
      UNAVAILABLE: "OFF",
      INVALID: "BAD"
    };
    const LCD_AI_SHORT = {
      ACTIVE: "ON",
      BLOCKED: "HOLD",
      MODEL_PENDING: "HOLD",
      NOT_APPLICABLE: "N/A",
      UNAVAILABLE: "OFF",
      NOT_EVALUATED: "?"
    };
    const LCD_RUNTIME_LABELS = {
      READY: "운영 가능",
      READY_WITH_LIMITATIONS: "제한 운영",
      DEGRADED: "성능 저하",
      NOT_READY: "운영 불가"
    };

    function lcdSensorShort(status) {
      return LCD_SENSOR_SHORT[status] || "?";
    }

    function lcdAiShort(status) {
      if (status === "ACTIVE") return LCD_AI_SHORT.ACTIVE;
      return LCD_AI_SHORT[status] || "?";
    }

    function runtimeDocument(payload) {
      return payload?.runtime_status && typeof payload.runtime_status === "object"
        ? payload.runtime_status
        : {};
    }

    function legacySensorState(sensor, values, valid) {
      const statusMap = {
        live: "LIVE",
        stale: "STALE",
        error: "INVALID",
        waiting: "NO_DATA"
      };
      const status = statusMap[sensor?.status] || "NO_DATA";
      return {
        status,
        current: status === "LIVE" && sensor?.fresh === true,
        connected: sensor?.connected === true,
        valid: valid === true,
        values,
      };
    }

    function normalizeSensors(sensors) {
      const integrated = ["mmwave", "thermal", "co2", "pir"]
        .some((sensorId) => sensors?.[sensorId]?.state);
      if (integrated) return sensors;

      const legacy = sensors || {};
      const valid = legacy.valid || {};
      const mmwaveValid = valid.respiration === true || valid.heart === true;
      return {
        mmwave: {
          state: legacySensorState(
            legacy,
            {
              respiration_rate_bpm: legacy.resp_rate_bpm,
              heart_rate_bpm: legacy.heart_rate_bpm,
              respiration_valid: valid.respiration === true,
              heart_valid: valid.heart === true,
            },
            mmwaveValid,
          ),
        },
        thermal: {
          state: legacySensorState(legacy, {}, false),
        },
        co2: {
          state: legacySensorState(
            legacy,
            { ppm: legacy.co2_ppm },
            valid.co2 === true,
          ),
        },
        pir: {
          state: legacySensorState(
            legacy,
            { motion: legacy.pir_motion },
            typeof legacy.pir_motion === "boolean",
          ),
        },
      };
    }

    function sensorState(sensor) {
      return sensor?.state || {};
    }

    function sensorValues(sensor) {
      return sensorState(sensor).values || {};
    }

    function isCurrent(sensor) {
      const currentState = sensorState(sensor);
      return currentState.status === "LIVE" && currentState.current === true;
    }

    function unavailableValue(sensor, valid) {
      const currentState = sensorState(sensor);
      if (currentState.status === "NO_DATA" || !currentState.status) return "수신 대기";
      if (currentState.status === "DISCONNECTED") return "연결 끊김";
      if (currentState.status === "STALE") return "지연";
      if (currentState.status === "INVALID" || valid !== true) return "측정 중";
      return "측정 중";
    }

    function numberValue(sensor, value, valid, digits, unit) {
      return isCurrent(sensor) && valid === true && Number.isFinite(value)
        ? `${value.toFixed(digits)} ${unit}`
        : unavailableValue(sensor, valid);
    }

    function sensorMetrics(sensors) {
      const normalizedSensors = normalizeSensors(sensors);
      const mmwave = normalizedSensors.mmwave;
      const co2 = normalizedSensors.co2;
      const pir = normalizedSensors.pir;
      const mmwaveValues = sensorValues(mmwave);
      const co2Values = sensorValues(co2);
      const pirValues = sensorValues(pir);
      const motion = pirValues.motion;
      const motionValue = isCurrent(pir) && typeof motion === "boolean"
        ? (motion ? "감지됨" : "감지 안 됨")
        : unavailableValue(pir, typeof motion === "boolean");

      return [
        ["호흡수", numberValue(
          mmwave,
          mmwaveValues.respiration_rate_bpm,
          mmwaveValues.respiration_valid,
          1,
          "회/분",
        )],
        ["심박수", numberValue(
          mmwave,
          mmwaveValues.heart_rate_bpm,
          mmwaveValues.heart_valid,
          1,
          "bpm",
        )],
        ["CO₂", numberValue(
          co2,
          co2Values.ppm,
          sensorState(co2).valid === true,
          0,
          "ppm",
        )],
        ["움직임", motionValue]
      ];
    }

    function renderSensorStatus(payload, sensors) {
      const runtimeStatus = runtimeDocument(payload).status;
      if (runtimeStatus) {
        const datasetStatus = {
          READY: "live",
          READY_WITH_LIMITATIONS: "limited",
          DEGRADED: "stale",
          NOT_READY: "error"
        }[runtimeStatus] || "waiting";
        sensorStatus.dataset.status = datasetStatus;
        sensorStatus.textContent = LCD_RUNTIME_LABELS[runtimeStatus] || "상태 미확인";
        return;
      }
      const normalizedSensors = normalizeSensors(sensors);
      const statuses = Object.values(normalizedSensors)
        .map((sensor) => sensorState(sensor).status)
        .filter((status) => typeof status === "string");
      let status = "waiting";
      if (statuses.length && statuses.every((item) => item === "LIVE")) {
        status = "live";
      } else if (statuses.some((item) => item === "STALE")) {
        status = "stale";
      } else if (statuses.some((item) => item === "DISCONNECTED")) {
        status = "error";
      } else if (statuses.some((item) => item === "INVALID")) {
        status = "error";
      }
      const labels = {
        live: "센서 실시간",
        stale: "센서 지연",
        error: "센서 수신기 오류",
        waiting: "센서 연결 대기"
      };
      sensorStatus.dataset.status = status;
      sensorStatus.textContent = labels[status];
    }

    function renderAvailability(payload) {
      const runtime = runtimeDocument(payload);
      if (!runtime.status) {
        availability.replaceChildren();
        return;
      }
      const sensors = runtime.sensors || {};
      const rows = [
        ["CO2", sensors.co2],
        ["THM", sensors.thermal],
        ["PIR", sensors.pir],
      ];
      const nodes = rows.map(([code, entry]) => {
        const item = document.createElement("div");
        item.className = "availability-item";
        const name = document.createElement("span");
        name.textContent = code;
        const value = document.createElement("strong");
        const sensor = lcdSensorShort(entry?.sensor_status);
        const ai = lcdAiShort(entry?.ai_status);
        value.textContent = `S:${sensor} AI:${ai}`;
        item.append(name, value);
        return item;
      });
      const system = document.createElement("div");
      system.className = "availability-item";
      const systemName = document.createElement("span");
      systemName.textContent = "SYS";
      const systemValue = document.createElement("strong");
      const globalStatus = runtime.status;
      systemValue.textContent = {
        READY: "READY",
        READY_WITH_LIMITATIONS: "LIMITED",
        DEGRADED: "DEGRADED",
        NOT_READY: "NOT READY"
      }[globalStatus] || "?";
      system.append(systemName, systemValue);
      availability.replaceChildren(...nodes, system);
    }

    function render(payload = {}) {
      const safePayload = payload && typeof payload === "object" ? payload : {};
      const stateName = typeof safePayload.state === "string" ? safePayload.state : "offline";
      const scenario = scenarios[stateName] || scenarios.offline;
      lcd.dataset.state = stateName in scenarios ? stateName : "offline";
      roomName.textContent = safePayload.room || "밀폐공간 A-01";
      statusPill.textContent = scenario.pill;
      stateTitle.textContent = scenario.title;
      stateSubtitle.textContent = scenario.subtitle;
      comment.textContent = scenario.comment;
      const sensors = normalizeSensors(safePayload.sensors);
      renderSensorStatus(safePayload, sensors);
      renderAvailability(safePayload);
      metrics.replaceChildren(...sensorMetrics(sensors).map(([label, value]) => {
        const item = document.createElement("div");
        item.className = "metric";
        const labelElement = document.createElement("span");
        labelElement.className = "metric-label";
        labelElement.textContent = label;
        const valueElement = document.createElement("strong");
        valueElement.className = "metric-value";
        valueElement.textContent = value;
        item.append(labelElement, valueElement);
        return item;
      }));
    }

    function renderProbability(index, value) {
      const [barId, valueId] = THERMAL_PROBABILITIES[index];
      const numeric = Number.isFinite(value) ? Math.max(0, Math.min(1, value)) : null;
      document.getElementById(barId).style.width = numeric == null ? "0" : `${(numeric * 100).toFixed(1)}%`;
      document.getElementById(valueId).textContent = numeric == null ? "—" : `${Math.round(numeric * 100)}%`;
    }

    function renderThermalDocument(payload = {}) {
      const frame = payload.frame || {};
      if (frame.available === true && Number.isFinite(frame.sequence)) {
        const visualStatus = frame.current === true ? "live" : "stale";
        thermalPanel.dataset.status = visualStatus;
        thermalFrame.textContent = `Frame ${frame.sequence}`;
        thermalRange.textContent = Number.isFinite(frame.raw_minimum) && Number.isFinite(frame.raw_maximum)
          ? `RAW ${frame.raw_minimum}–${frame.raw_maximum}`
          : "RAW 범위 —";
        thermalPlaceholder.textContent = frame.current === true
          ? "열화상 불러오는 중"
          : "최근 프레임 · 실시간 수신 지연";
        if (lastThermalSequence !== frame.sequence && typeof frame.image_url === "string") {
          lastThermalSequence = frame.sequence;
          thermalImage.src = frame.image_url;
        }
      } else {
        thermalPanel.dataset.status = "waiting";
        thermalFrame.textContent = "프레임 대기";
        thermalRange.textContent = "RAW 범위 —";
        thermalPlaceholder.textContent = "열화상 프레임 수신 대기";
        thermalImage.removeAttribute("src");
        lastThermalSequence = null;
      }

      const inference = payload.inference || {};
      const className = inference.available === true && typeof inference.state === "string"
        ? inference.state
        : "INPUT_UNAVAILABLE";
      thermalAiPanel.dataset.class = className;
      thermalAiLabel.textContent = inference.label_ko || THERMAL_CLASS_LABELS[className] || "판정 확인 필요";
      thermalAiClass.textContent = className;
      thermalAiConfidence.textContent = Number.isFinite(inference.confidence)
        ? `신뢰도 ${(inference.confidence * 100).toFixed(1)}%`
        : "신뢰도 —";

      const probabilities = Array.isArray(inference.probabilities) ? inference.probabilities : [];
      THERMAL_PROBABILITIES.forEach((_, index) => renderProbability(index, probabilities[index]));
      if (inference.available === true) {
        const model = [inference.model_id, inference.model_version].filter(Boolean).join(" · ") || "Thermal TFLite";
        const latency = Number.isFinite(inference.latency_ms) ? ` · ${inference.latency_ms.toFixed(1)} ms` : "";
        const analyzedFrame = Number.isFinite(inference.frame_sequence) ? ` · AI Frame ${inference.frame_sequence}` : "";
        const match = inference.matches_displayed_frame === true ? " · 화면과 일치" : " · 최근 추론";
        thermalAiMeta.textContent = `${model}${latency}${analyzedFrame}${match}`;
      } else {
        thermalAiMeta.textContent = `AI 사용 불가 · ${inference.error || "프레임/모델 대기"}`;
      }
    }

    thermalImage.addEventListener("error", () => {
      thermalPanel.dataset.status = "error";
      thermalPlaceholder.textContent = "OpenCV 열화상 변환 오류";
    });

    async function syncThermal() {
      if (thermalRequestInFlight) return;
      thermalRequestInFlight = true;
      try {
        const response = await fetch("/api/lcd/thermal", { cache: "no-store" });
        if (!response.ok) throw new Error("thermal request failed");
        renderThermalDocument(await response.json());
      } catch (error) {
        renderThermalDocument({ inference: { error: "THERMAL_API_UNAVAILABLE" } });
        thermalPanel.dataset.status = "error";
        thermalPlaceholder.textContent = "열화상 API 연결 확인 필요";
      } finally {
        thermalRequestInFlight = false;
      }
    }

    async function sync() {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) throw new Error("state request failed");
        const payload = await response.json();
        render(payload);
        if (failed) {
          connection.textContent = "제어 서버 연결됨";
          connection.classList.add("visible");
          setTimeout(() => connection.classList.remove("visible"), 1200);
        }
        failed = false;
      } catch (error) {
        if (!failed) {
          render({ state: "offline", room: roomName.textContent, sensors: {} });
        }
        failed = true;
        connection.textContent = "제어 서버 연결 끊김";
        connection.classList.add("visible");
      }
    }

    render({ state: "normal-empty", room: "밀폐공간 A-01" });
    sync();
    syncThermal();
    setInterval(sync, 400);
    setInterval(syncThermal, 500);
  </script>
</body>
</html>
